
# In main conf file
# bindsym $mod+q exec $term

set $notif_script_path $config_root/scripts/notificationScript.sh
set $menu_cmd wofi -i --show drun | xargs swaymsg exec --

set $bright_up XF86MonBrightnessUp
set $bright_down XF86MonBrightnessDown

set $sound_up XF86AudioRaiseVolume
set $sound_down XF86AudioLowerVolume
set $sound_mute XF86AudioMute

set $prt_sc Print


bindsym $mod+space exec $menu_cmd
# bindgesture swipe:3:up exec $menu_cmd

bindsym $mod+e exec nemo
bindsym $mod+a exec /usr/bin/code --enable-features=UseOzonePlatform,WaylandWindowDecorations --ozone-platform=wayland
bindsym $mod+s exec firefox
bindsym $mod+d exec qalculate-gtk


bindsym $mod+shift+s floating toggle


# Audio
bindsym $sound_up   exec $notif_script_path v +3%
bindsym $sound_down exec $notif_script_path v -3%
bindsym $sound_mute exec $notif_script_path mute

# Screen brightness
bindsym $bright_up   exec $notif_script_path b 3%+
bindsym $bright_down exec $notif_script_path b 3%-
bindsym $secondary+$bright_up   exec $notif_script_path b 1+
bindsym $secondary+$bright_down exec $notif_script_path b 1-
bindsym $alt+$bright_up   exec $notif_script_path b 10%+
bindsym $alt+$bright_down exec $notif_script_path b 10%-
bindsym $secondary+$alt+$bright_up   exec $notif_script_path b 100%
bindsym $secondary+$alt+$bright_down exec $notif_script_path b 0%


# Clipboard
bindsym $mod+v exec cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Screenshot
bindsym $prt_sc exec grim -g "$(slurp)" | wl-copy
